<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo livro disponível</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #757575;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
        }

        .main-content {
            padding: 27px 18px 63px;
        }

        h2 {
            color: #222;
            font-size: 28px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .message {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .book-image {
            width: 100%;
            max-width: 600px;
            height: auto;
            border: none;
            display: block;
            margin: 20px 0;
        }

        .button {
            display: block;
            background-color: #009FC7;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            padding: 18px;
            text-align: center;
            border-radius: 3px;
            margin: 30px 0;
        }

        .footer {
            background-color: #333;
            color: white;
            padding: 45px 18px 63px;
            text-align: center;
        }

        .footer a {
            color: white;
        }

        @media only screen and (max-width: 600px) {
            .main-content {
                padding: 20px 15px 40px;
            }

            h2 {
                font-size: 24px;
            }

            .message {
                font-size: 16px;
            }

            .book-image {
                width: 100%;
            }

            .button {
                font-size: 16px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <h2>Novo livro disponível: {BookTitle}</h2>

            <div class="message">
                Olá, {Name}.<br><br>
                Um novo livro está disponível para doação no Sharebook.<br><br>
                <img src="{BackendUrl}/Images/Books/{BookImageSlug}" alt="{BookTitle}" class="book-image">
            </div>

            <a href="{FrontendUrl}/livros/{BookSlug}" class="button" target="_blank">
                Ver o livro
            </a>

        </div>

        <div class="footer">
            <p>
                Se precisar de ajuda, <a href="https://www.sharebook.com.br/contact-us">fale com a gente</a>.
            </p>
            <p>
                Um abraço,<br>
                Equipe Sharebook<br>
                <small>Compartilhando conhecimento</small>
            </p>
        </div>
    </div>
</body>
</html>
