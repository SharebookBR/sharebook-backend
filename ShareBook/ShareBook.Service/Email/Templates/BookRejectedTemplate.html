<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doação não aprovada</title>
</head>
<body style="margin:0;padding:24px;background:#f2f2f2;font-family:Arial,Helvetica,sans-serif;color:#333;line-height:1.6;">
  <div style="max-width:600px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden;">
    <div style="padding:28px 24px;background:#29abe2;color:#fff;text-align:center;">
      <strong>Sharebook</strong>
      <h1 style="margin:10px 0 0;font-size:22px;font-weight:400;">Doação não aprovada</h1>
    </div>
    <div style="padding:30px 24px;">
      <p>Olá!</p>
      <p>Não conseguimos aprovar a doação do livro <strong>“{BookTitle}”</strong>.</p>
      <div style="margin:24px 0;padding:18px;background:#e8f4fd;border-left:4px solid #29abe2;border-radius:4px;">
        <strong>Mensagem da equipe</strong>
        <p style="margin:8px 0 0;">{Reason}</p>
      </div>
      <p>Se quiser conversar sobre isso, <a href="https://www.sharebook.com.br/contact-us">fale com a gente</a>.</p>
    </div>
    <div style="padding:22px 24px;background:#333;color:#fff;text-align:center;">
      Um abraço,<br>
      <strong>Equipe Sharebook</strong><br>
      <small>Compartilhando conhecimento</small>
    </div>
  </div>
</body>
</html>
